<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Skills Test</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;600;700&display=swap');

        :root {
            --red: #b3122b;
            --red-dark: #7a0c1e;
            --gold: #f0b323;
            --gold-light: #ffd966;
            --steel: #15161a;
            --steel-light: #23252c;
            --arc: #7df9ff;
        }

        * { box-sizing: border-box; }

        html { height: 100%; }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
            color: #e2e8f0;
            background-color: #090d16;
            background: 
                radial-gradient(circle at 50% 0%, rgba(179, 18, 43, 0.35), transparent 55%),
                radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                linear-gradient(180deg, var(--steel) 0%, #0b0b0e 100%);
            min-height: 100vh;
        }

        /* Navigation bar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(90deg, var(--red-dark), var(--red) 50%, var(--red-dark));
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold-light);
            text-decoration: none;
        }

        .nav-brand .mini-reactor {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, var(--arc) 35%, #1b6f78 70%, #0b2f33 100%);
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px var(--arc);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 0.55rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold-light);
            text-decoration: none;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid transparent;
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .nav-links a:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(240, 179, 35, 0.45);
        }

        .nav-links a[aria-current="page"] {
            color: var(--steel);
            background: var(--gold);
            border-color: var(--gold-light);
        }

        .nav-links a:focus-visible,
        .nav-toggle:focus-visible,
        .nav-brand:focus-visible {
            outline: 2px solid var(--arc);
            outline-offset: 2px;
        }

        .nav-toggle {
            display: none;
            padding: 0.45rem 0.8rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            color: var(--gold-light);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold);
            border-radius: 6px;
            cursor: pointer;
        }

        @media (max-width: 720px) {
            .nav-toggle { display: block; }

            .nav-links {
                display: none;
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }

            .nav-links.open { display: flex; }

            .nav-links a { text-align: center; }
        }

        /* Layout Centering */
        .container {
            width: 100%;
            max-width: 1140px;
            margin-right: auto;
            margin-left: auto;
            padding: 3rem 1.5rem !important;
        }

        .row {
            display: flex;
            justify-content: center;
        }

        .col-lg-7, .col-md-9 {
            width: 100%;
            max-width: 620px;
        }

        /* Kingdom of Science Laboratory Card */
        .card {
            border: 2px solid #22c55e !important;
            border-radius: 20px !important;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(34, 197, 94, 0.25) !important;
            overflow: hidden;
        }

        /* Senku's Stone Header & Miracle Fluid Gradient */
        .card-header, .bg-primary {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%) !important;
            color: #ffffff !important;
            text-align: center;
            padding: 2.25rem 1.5rem !important;
            border-bottom: 3px solid #4ade80 !important;
        }

        .card-header h2 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin: 0 0 0.4rem 0;
            color: #4ade80;
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
        }

        .card-header h2 i {
            color: #a3e635;
        }

        .card-header p.mb-0 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            color: #cbd5e1;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Card Content Area */
        .card-body, .p-4 {
            padding: 2.25rem !important;
            color: #cbd5e1;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .card-body strong {
            color: #4ade80;
            font-weight: 700;
        }

        .card-body b {
            color: #a3e635;
        }

        /* Form Section */
        form {
            margin-top: 1.5rem;
        }

        .form-label, .fw-bold {
            display: block;
            margin-bottom: 0.5rem;
            font-family: 'Share Tech Mono', monospace;
            font-weight: 700 !important;
            color: #f1f5f9;
            letter-spacing: 0.5px;
        }

        .form-label i {
            color: #4ade80;
        }

        /* Science Terminal Input */
        input.form-control, .form-control-lg {
            width: 100%;
            padding: 0.85rem 1.1rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            color: #f8fafc;
            background-color: #022c22;
            border: 1.5px solid #16a34a;
            border-radius: 12px;
            transition: all 0.25s ease;
            outline: none;
            box-sizing: border-box;
        }

        input.form-control::placeholder {
            color: #475569;
        }

        input.form-control:focus {
            border-color: #4ade80;
            background-color: #064e3b;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.35);
        }

        /* Miracle Fluid Action Button */
        input[type="button"] {
            width: 100%;
            display: block;
            padding: 0.95rem 1.5rem;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #022c22;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            margin-top: 1.25rem;
        }

        input[type="button"]:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #a3e635 0%, #4ade80 100%);
            box-shadow: 0 0 30px rgba(163, 230, 53, 0.6);
            color: #052e16;
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        /* Divider Line */
        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #22c55e, transparent);
            margin: 2rem 0;
        }

        /* Result Title */
        h3.text-primary {
            font-family: 'Share Tech Mono', monospace;
            color: #4ade80 !important;
            font-size: 1.4rem;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        /* Science Laboratory Formula Result Box */
        #result {
            background-color: #022c22;
            border: 1px solid #16a34a;
            border-radius: 14px !important;
            padding: 1.25rem !important;
            min-height: 100px;
            color: #f8fafc;
            font-size: 1.05rem;
            line-height: 1.8;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5) !important;
        }

        #result b, #result strong {
            color: #4ade80;
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>

<body>

        <nav class="navbar" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">
            TLE Club
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links"
                onclick="var l=document.getElementById('nav-links');var o=l.classList.toggle('open');this.setAttribute('aria-expanded',o);">
            Menu
        </button>
<ul class="nav-links" id="nav-links">
    <li><a href="index.html">Homepage</a></li>
    <li><a href="element-checker.html" aria-current="page">Element Checker</a></li>
    <li><a href="club-members.html">School Club Members</a></li>
    <li><a href="creator.html">Meet the Creator</a></li>
</ul>
    </nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center p-4">

                    <h2>
                        <i class="bi bi-flask-fill"></i>
                        Non-Metal Elements
                    </h2>

                    <p class="mb-0">
                        Periodic Table Information Finder
                    </p>

                </div>

                <div class="card-body p-4">
                        <strong>Instructions:</strong><br>
                        Enter the <b>symbol</b> of a non-metal element
                        (Example: Se, Ar, Br, Ne, Xe).

                    <form>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                <i class="bi bi-search"></i>
                                Element Symbol
                            </label>

                            <input
                                type="text"
                                id="element_name"
                                class="form-control form-control-lg"
                                placeholder="Enter the symbol here">

                        </div>

                            <input
                                type="button"
                                py-click="element_checker"
                                value="Check Details">

                    </form>

                    <hr>

                    <h3 class="text-primary">
                        Result
                    </h3>

                    <div id="result" class="rounded p-3 shadow-sm">

                    </div>

                </div>       
            </div>

        </div>

    </div>
</div>

<py-script src="main.py"></py-script>

</body>
</html>
